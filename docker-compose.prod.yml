version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homecare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homecare_prod_secret}
      POSTGRES_DB: ${POSTGRES_DB:-homecare}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-homecare}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-homecare}:${POSTGRES_PASSWORD:-homecare_prod_secret}@postgres:5432/${POSTGRES_DB:-homecare}
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'

volumes:
  pgdata:
  redisdata:
