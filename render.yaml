# Render.com Free-Tier Infrastructure Blueprint (1-Click Deploy)
# Deploys Managed PostgreSQL, NestJS Backend API + WebSocket Server, and Next.js Admin Portal

databases:
  - name: homecare-db
    databaseName: homecare
    user: homecare
    plan: free

services:
  # 1. Backend API & Real-Time WebSocket Server
  - type: web
    name: homecare-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm --prefix packages/contracts run build && npm --prefix apps/api run build
    startCommand: node scripts/migrate.mjs && node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: homecare-db
          property: connectionString
      - key: REDIS_URL
        value: memory

  # 2. Next.js Clinical Admin & Dispatch Portal
  - type: web
    name: homecare-admin
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm --prefix packages/contracts run build && npm --prefix packages/design-tokens run build && npm --prefix apps/admin run build
    startCommand: npx next start apps/admin -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
