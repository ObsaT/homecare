name: Deploy Flutter Mobile Web App (GitHub Pages Free Hosting)

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/deploy-mobile-web.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Production Backend API URL (e.g. https://homecare-api.onrender.com/api/v1)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build Flutter Web (Release, Offline CanvasKit)
        working-directory: apps/mobile
        env:
          PROD_API_URL: ${{ inputs.api_url || vars.NEXT_PUBLIC_API_URL || '' }}
        run: |
          if [ -n "$PROD_API_URL" ]; then
            flutter build web --release --no-web-resources-cdn --base-href "/homecare/" --dart-define=API_URL="$PROD_API_URL"
          else
            flutter build web --release --no-web-resources-cdn --base-href "/homecare/"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'apps/mobile/build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
